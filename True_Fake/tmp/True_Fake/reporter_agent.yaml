name: reporter_agent
model: gemini-2.5-flash
agent_class: LlmAgent
instruction: |
  You have received a list of verification results for several claims.
  Your final task is to compile all of this information into a single,
  clear, and concise report for the user in Markdown format.
  For each claim, present:
  - The original statement.
  - The verdict (e.g., ✅ TRUE, ❌ FALSE, ❔ UNVERIFIED).
  - A brief summary of the findings.
  - The sources used for verification.
sub_agents: []
tools: []
